[package]
name = "image-proc"
version = "3.0.0"
edition = "2021"
description = "Image processing coprocessor for OuEstCharlie: AVIF grid assembly and JPEG preview generation."

[lib]
name = "image_proc"
path = "src/lib.rs"

[[bin]]
name = "image-proc"
path = "src/main.rs"

[build-dependencies]
# No build-time crate dependencies. build.rs only emits a link directive
# (advapi32) for the Windows + heic static-link case — see build.rs.

[features]
# RAW format support (CR2, NEF, ARW, DNG, RAF, ORF, RW2, PEF) via rawler (pure Rust).
raw = ["dep:rawler"]
# HEIC/HEIF and AVIF support via libheif-rs (requires: brew install libheif / apt install libheif-dev).
heic = ["dep:libheif-rs"]

[dependencies]
# Image decoding: JPEG, PNG, WebP, TIFF, GIF, BMP (pure Rust, no system deps).
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png", "webp", "tiff", "gif", "bmp"] }
# JPEG XL decoding (pure Rust, no system deps, so always built in).
jxl-oxide = { version = "0.12", features = ["image"] }
# Pure-Rust AVIF encoder (replaces libavif — no system deps, cross-platform).
# Uses rav1e with nasm assembly for optimised encoding (install nasm before building).
ravif = "0.11"
# Pixel type used by ravif's Img<&[RGB8]> API.
rgb = "0.8"
# Parallel photo decoding.
rayon = "1"
# JSON I/O (stdin/stdout protocol).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# RAW photo decoding (pure Rust — no system deps; API is pre-1.0, pin the version).
[dependencies.rawler]
version = "=0.7.2"
optional = true

# HEIC/HEIF decoding (requires system libheif).
[dependencies.libheif-rs]
version = "1"
optional = true
