name: Build (reusable)

on:
  workflow_call:

permissions:
  contents: read

env:
  # libheif-rs 1.x requires libheif >= 1.18; built from source on Linux.
  LIBHEIF_VERSION: "1.19.7"
  # Oldest macOS the wheel supports. Must match the macOS runner below: the
  # Homebrew libheif (and codecs) bundled by delocate are built for the
  # runner's OS, so they set the floor. Cargo reads this for the Rust binary.
  MACOS_MIN_VERSION: "14.0"

jobs:
  build-wheel:
    name: Build wheel on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # macOS arm64 — pinned, sets the wheel's minimum macOS
          - os: ubuntu-22.04      # Linux x86_64
          - os: windows-latest    # Windows x86_64

    steps:
      - uses: actions/checkout@v6

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm inih libheif

      - name: Target minimum macOS version (macOS)
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=${MACOS_MIN_VERSION}" >> "$GITHUB_ENV"

      # Ubuntu 22.04's apt libheif is 1.12, but libheif-rs 1.x requires
      # libheif >= 1.18 (pkg-config reports it as "not found" on a version
      # mismatch). Build a recent libheif from source. Codec dev libs come
      # from apt; the built tree is cached (keyed on LIBHEIF_VERSION) so the
      # compile only runs on a cache miss.
      - name: Install nasm and codec deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm cmake pkg-config \
            libde265-dev libx265-dev libaom-dev

      - name: Cache libheif build (Linux)
        if: runner.os == 'Linux'
        id: cache-libheif
        uses: actions/cache@v4
        with:
          path: /usr/local
          key: libheif-${{ env.LIBHEIF_VERSION }}-ubuntu-22.04

      - name: Build and install libheif from source (Linux)
        if: runner.os == 'Linux' && steps.cache-libheif.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "v${LIBHEIF_VERSION}" \
            https://github.com/strukturag/libheif.git /tmp/libheif
          cmake -S /tmp/libheif -B /tmp/libheif/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DWITH_EXAMPLES=OFF
          cmake --build /tmp/libheif/build -j"$(nproc)"
          sudo cmake --install /tmp/libheif/build

      - name: Refresh linker cache and expose pkg-config (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo ldconfig
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/local/lib/x86_64-linux-gnu/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - name: Install nasm (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nasm -y --no-progress

      # NOTE: this step is the highest-risk part of OEC-30a (see the issue for
      # context) — vcpkg-built libheif pulls in libde265/x265/aom and may be
      # slow or need extra flags. The triplet must be x64-windows-static-md:
      # vcpkg-rs (libheif-sys' build script) defaults to that triplet on MSVC,
      # so the dynamic x64-windows triplet is reported as "not installed".
      # static-md also avoids bundling DLLs into the wheel (CRT stays dynamic).
      # Verify against a live CI run and adjust (e.g. cache the vcpkg tree via
      # actions/cache, keyed on the libheif port version) before relying on this.
      - name: Bootstrap vcpkg and install libheif (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg.exe install libheif:x64-windows-static-md
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          echo "VCPKG_INSTALLATION_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: image-proc
          # Cache only the cargo registry/git (dependency downloads), not the
          # compiled target/. For a --release build the target tree is large and
          # zstd save/restore dominates on Linux, often outweighing the compile
          # it saves; the registry cache keeps the download savings without it.
          cache-targets: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install build tools
        run: pip install hatch auditwheel delocate

      # Ubuntu 22.04's apt patchelf is 0.14.3, but auditwheel repair needs
      # >= 0.14.5. The PyPI package bundles a recent binary and, being on the
      # setup-python PATH, takes precedence over /usr/bin. Staying on 22.04
      # keeps the wheel's manylinux glibc baseline low (2.35).
      - name: Install patchelf (Linux)
        if: runner.os == 'Linux'
        run: pip install patchelf

      - name: Rust unit tests (image-proc)
        working-directory: image-proc
        run: cargo test --release --features raw,heic

      - name: Build wheel
        run: hatch build --target wheel
        env:
          IMAGE_PROC_FEATURE_RAW: "1"
          IMAGE_PROC_FEATURE_HEIC: "1"

      - name: Bundle libheif into wheel (macOS)
        if: runner.os == 'macOS'
        # Fail instead of silently raising the wheel's macOS tag when a bundled
        # library needs a newer macOS than MACOS_MIN_VERSION.
        run: |
          delocate-wheel --require-target-macos-version "${MACOS_MIN_VERSION}" -w dist/ -v dist/*.whl

      # Belt and braces over delocate: every Mach-O file in the wheel (the
      # binary and each bundled dylib) must load on MACOS_MIN_VERSION.
      - name: Verify minimum macOS version of bundled binaries (macOS)
        if: runner.os == 'macOS'
        run: |
          rm -rf /tmp/whl && mkdir /tmp/whl && unzip -q dist/*.whl -d /tmp/whl
          rc=0
          while IFS= read -r f; do
            minos="$(otool -l "$f" | awk '/LC_BUILD_VERSION/{b=1} b&&/minos/{print $2; exit}')"
            echo "$minos  ${f#/tmp/whl/}"
            if [ "$(printf '%s\n%s\n' "$minos" "$MACOS_MIN_VERSION" | sort -V | tail -1)" != "$MACOS_MIN_VERSION" ]; then
              echo "::error::${f#/tmp/whl/} requires macOS $minos > $MACOS_MIN_VERSION"
              rc=1
            fi
          done < <(find /tmp/whl -type f -exec sh -c 'file -b "$1" | grep -q Mach-O' _ {} \; -print)
          exit $rc

      - name: Install wheel
        working-directory: dist
        shell: bash
        run: pip install ouestcharlie_imageproc-*.whl pytest pytest-asyncio

      - name: Run unit tests
        run: python -m pytest tests/ -v

      - name: Run integration tests
        run: python -m pytest tests_integration/ -v
        env:
          # The wheel was built with HEIC: HEIC tests must run, not skip.
          IMAGE_PROC_FEATURE_HEIC: "1"

      - name: Repair wheel (Linux — retag linux_x86_64 → manylinux, bundle libheif)
        if: runner.os == 'Linux'
        run: |
          auditwheel repair dist/*.whl -w dist/
          rm dist/*-linux_x86_64.whl

      # image-proc is a standalone binary, so auditwheel leaves it alone — the
      # hatch build hook bundles libheif beside it and sets RUNPATH=$ORIGIN.
      # This runner has /usr/local libheif, which would mask a broken bundle,
      # so hide it and confirm the binary still resolves heif_init.
      - name: Verify image-proc is self-contained (Linux)
        if: runner.os == 'Linux'
        run: |
          BIN="$(python -c 'import ouestcharlie_imageproc, pathlib; print(pathlib.Path(ouestcharlie_imageproc.__file__).parent / "bin" / "image-proc")')"
          echo "RUNPATH: $(patchelf --print-rpath "$BIN")"
          ls -1 "$(dirname "$BIN")" | grep -q '^libheif' || { echo "libheif not bundled next to image-proc"; exit 1; }
          sudo mv /usr/local/lib /usr/local/lib.hidden
          sudo ldconfig || true
          "$BIN" --version
          sudo mv /usr/local/lib.hidden /usr/local/lib
          sudo ldconfig || true

      # The wheel holds no CPython extension, so it must install on any
      # Python version (OEC-61). A cpXYZ tag would silently force an sdist
      # build — without HEIC/RAW — on every other version.
      - name: Verify wheel tag is Python-version independent
        shell: bash
        run: |
          ls dist/*.whl
          for w in dist/*.whl; do
            case "$(basename "$w")" in
              ouestcharlie_imageproc-*-py3-none-*.whl) ;;
              *) echo "::error::unexpected wheel tag: $w"; exit 1 ;;
            esac
          done

      - uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install hatch
        run: pip install hatch
      - name: Build sdist
        run: hatch build --target sdist
      - uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist/*.tar.gz
