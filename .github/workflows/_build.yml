name: Build (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-wheel:
    name: Build wheel on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # macOS arm64
          - os: ubuntu-22.04      # Linux x86_64
          - os: windows-latest    # Windows x86_64

    steps:
      - uses: actions/checkout@v6

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm inih libheif

      - name: Install nasm and libheif (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm libheif-dev

      - name: Install nasm (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nasm -y --no-progress

      # NOTE: this step is the highest-risk part of OEC-30a (see the issue for
      # context) — vcpkg-built libheif pulls in libde265/x265/aom and may be
      # slow or need extra flags. Verify against a live CI run and adjust
      # (e.g. cache the vcpkg tree via actions/cache, keyed on the libheif
      # port version) before relying on this.
      - name: Bootstrap vcpkg and install libheif (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg.exe install libheif:x64-windows
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          echo "VCPKG_INSTALLATION_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: image-proc

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tools
        run: pip install hatch auditwheel delocate

      - name: Rust unit tests (image-proc)
        working-directory: image-proc
        run: cargo test --release --features raw,heic

      - name: Build wheel
        run: hatch build --target wheel
        env:
          IMAGE_PROC_FEATURE_RAW: "1"
          IMAGE_PROC_FEATURE_HEIC: "1"

      - name: Bundle libheif into wheel (macOS)
        if: runner.os == 'macOS'
        run: |
          delocate-wheel -w dist/ -v dist/*.whl

      - name: Install wheel
        working-directory: dist
        shell: bash
        run: pip install ouestcharlie_imageproc-*.whl pytest pytest-asyncio

      - name: Run unit tests
        run: python -m pytest tests/ -v

      - name: Run integration tests
        run: python -m pytest tests_integration/ -v

      - name: Repair wheel (Linux — retag linux_x86_64 → manylinux, bundle libheif)
        if: runner.os == 'Linux'
        run: |
          auditwheel repair dist/*.whl -w dist/
          rm dist/*-linux_x86_64.whl

      - uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install hatch
        run: pip install hatch
      - name: Build sdist
        run: hatch build --target sdist
      - uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist/*.tar.gz
