name: Build (reusable)

on:
  workflow_call:

permissions:
  contents: read

env:
  # libheif-rs 1.x requires libheif >= 1.18; built from source on Linux.
  LIBHEIF_VERSION: "1.19.7"

jobs:
  build-wheel:
    name: Build wheel on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # macOS arm64
          - os: ubuntu-22.04      # Linux x86_64
          - os: windows-latest    # Windows x86_64

    steps:
      - uses: actions/checkout@v6

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm inih libheif

      # Ubuntu 22.04's apt libheif is 1.12, but libheif-rs 1.x requires
      # libheif >= 1.18 (pkg-config reports it as "not found" on a version
      # mismatch). Build a recent libheif from source. Codec dev libs come
      # from apt; the built tree is cached (keyed on LIBHEIF_VERSION) so the
      # compile only runs on a cache miss.
      - name: Install nasm and codec deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm cmake pkg-config \
            libde265-dev libx265-dev libaom-dev

      - name: Cache libheif build (Linux)
        if: runner.os == 'Linux'
        id: cache-libheif
        uses: actions/cache@v4
        with:
          path: /usr/local
          key: libheif-${{ env.LIBHEIF_VERSION }}-ubuntu-22.04

      - name: Build and install libheif from source (Linux)
        if: runner.os == 'Linux' && steps.cache-libheif.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "v${LIBHEIF_VERSION}" \
            https://github.com/strukturag/libheif.git /tmp/libheif
          cmake -S /tmp/libheif -B /tmp/libheif/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DWITH_EXAMPLES=OFF
          cmake --build /tmp/libheif/build -j"$(nproc)"
          sudo cmake --install /tmp/libheif/build

      - name: Refresh linker cache and expose pkg-config (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo ldconfig
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/local/lib/x86_64-linux-gnu/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - name: Install nasm (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nasm -y --no-progress

      # NOTE: this step is the highest-risk part of OEC-30a (see the issue for
      # context) — vcpkg-built libheif pulls in libde265/x265/aom and may be
      # slow or need extra flags. Verify against a live CI run and adjust
      # (e.g. cache the vcpkg tree via actions/cache, keyed on the libheif
      # port version) before relying on this.
      - name: Bootstrap vcpkg and install libheif (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg.exe install libheif:x64-windows
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          echo "VCPKG_INSTALLATION_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: image-proc

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build tools
        run: pip install hatch auditwheel delocate

      - name: Rust unit tests (image-proc)
        working-directory: image-proc
        run: cargo test --release --features raw,heic

      - name: Build wheel
        run: hatch build --target wheel
        env:
          IMAGE_PROC_FEATURE_RAW: "1"
          IMAGE_PROC_FEATURE_HEIC: "1"

      - name: Bundle libheif into wheel (macOS)
        if: runner.os == 'macOS'
        run: |
          delocate-wheel -w dist/ -v dist/*.whl

      - name: Install wheel
        working-directory: dist
        shell: bash
        run: pip install ouestcharlie_imageproc-*.whl pytest pytest-asyncio

      - name: Run unit tests
        run: python -m pytest tests/ -v

      - name: Run integration tests
        run: python -m pytest tests_integration/ -v

      - name: Repair wheel (Linux — retag linux_x86_64 → manylinux, bundle libheif)
        if: runner.os == 'Linux'
        run: |
          auditwheel repair dist/*.whl -w dist/
          rm dist/*-linux_x86_64.whl

      - uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install hatch
        run: pip install hatch
      - name: Build sdist
        run: hatch build --target sdist
      - uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist/*.tar.gz
