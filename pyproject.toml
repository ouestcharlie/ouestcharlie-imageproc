[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[project]
name = "ouestcharlie-imageproc"
version = "2.1.0"
description = "Image processing coprocessor for OuEstCharlie (Rust binary + Python wrapper)"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE*"]
authors = [
    { name = "Antoine Hue" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.0",
    "pre-commit>=4.5.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/ouestcharlie/ouestcharlie"
Issues = "https://github.com/ouestcharlie/ouestcharlie/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ouestcharlie_imageproc"]
artifacts = ["src/ouestcharlie_imageproc/bin/*"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
tmp_path_retention_policy = "none"

[tool.mypy]
python_version = "3.13"
strict = true
